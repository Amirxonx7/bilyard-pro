<style>
:root{--bg:#0A1310;--pn:#101B17;--p2:#16251F;--ln:#1F3129;--ink:#E7F0EB;--mu:#8AA297;--gr:#1FC77A;--gd:#0A7D4A;--rd:#E5484D;--gold:#F0BE2E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}

.app{display:grid;grid-template-columns:15.333rem 1fr;min-height:100vh}

.brand{display:flex;gap:0.667rem;align-items:center;padding:0 0.4rem 1.067rem}

.brand b{font-size:1.2rem}.brand b i{color:var(--gr);font-style:normal}
.brand small{display:block;color:var(--mu);font-size:.7rem;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:0.267rem}
.nav button{display:flex;align-items:center;gap:0.8rem;background:none;border:0;color:var(--mu);padding:0.733rem 0.8rem;border-radius:0.667rem;cursor:pointer;text-align:left}
.nav button.on{background:var(--p2);color:var(--gr);font-weight:700}
.nav .sh{display:none}
.me{margin-top:auto;border-top:1px solid var(--ln);padding:0.933rem 0.4rem 0}.me small{display:block;color:var(--mu)}
.main{padding:1.067rem 1.467rem 2.667rem;min-width:0}
.top{display:flex;justify-content:flex-end;gap:0.933rem;color:var(--mu);padding-bottom:0.8rem}.top b{color:var(--ink)}
h2{font-size:1.4rem;margin:0.4rem 0 0.933rem}h3{margin:0 0 0.667rem;font-size:1.05rem}
.mu,small{color:var(--mu)}
.hero{position:relative;overflow:hidden;border-radius:1.067rem;padding:1.733rem;margin-bottom:1.067rem;background:linear-gradient(100deg,var(--pn) 38%,#0E5A3C)}
.hero h1{margin:0 0 0.4rem;font-size:1.7rem}.hero h1 em{color:var(--gr);font-style:normal}.hero p{margin:0;color:var(--mu)}
.hero svg{position:absolute;right:-0.667rem;top:0.533rem;width:20rem;opacity:.35}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(12.667rem,1fr));gap:0.933rem;margin-bottom:1.067rem}
.sc{background:var(--pn);border:1px solid var(--ln);border-radius:0.933rem;padding:0.933rem;display:flex;gap:0.8rem;align-items:center}
.sc .ic{width:3.067rem;height:3.067rem;border-radius:0.8rem;background:var(--p2);display:grid;place-items:center;font-size:1.4rem}
.sc b{display:block;font-size:1.35rem}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(20.667rem,1fr));gap:1.067rem;margin-bottom:1.067rem}
.tc,.pn{background:var(--pn);border:1px solid var(--ln);border-radius:1.067rem;padding:1.067rem}
.pn{margin-bottom:1.067rem}
.th{display:flex;gap:0.667rem;align-items:center;margin-bottom:0.8rem}.th h3{margin:0}
.bd{font-size:.75rem;font-weight:700;padding:3px 0.667rem;border-radius:66.6rem;background:var(--p2);color:var(--mu)}.bd.on{background:#0E3D2A;color:var(--gr)}
.tb{display:flex;gap:0.933rem;align-items:center}
.pt{width:46%;max-width:12.667rem;height:auto;flex:none}
.ti{flex:1;min-width:0}.ti small{display:block}
.tm{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.tot{background:#0C2A1F;border:1px solid #14432F;border-radius:0.667rem;padding:0.533rem 0.667rem;margin-top:0.533rem}.tot b{color:var(--gr);font-size:1.15rem}
.free{font-size:1.05rem;color:var(--mu);margin-top:0.4rem}
.ta{display:flex;gap:0.533rem;margin-top:0.933rem}.ta .b{flex:1}
.b{border:0;border-radius:0.667rem;padding:0.733rem 0.933rem;font-weight:700;cursor:pointer;color:#fff}
.grn{background:var(--gd)}.red{background:#B83237}.ghost{background:var(--p2);border:1px solid var(--ln);color:var(--ink)}.wide{width:100%}
.b:disabled{opacity:.4;cursor:default}
.r3{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1.067rem}
.big{font-size:2rem;font-weight:800;color:var(--gr);margin:0.4rem 0}
.row{display:flex;justify-content:space-between;gap:0.667rem;padding:0.467rem 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}

async function activate(raw){
 try{
 const key=(raw||"").replace(/\s+/g,"");const parts=key.split(".");
 if(parts.length!==2||!parts[0]||!parts[1])return"Kalit toʻliq emas. Butun matnni oxirigacha nusxalab qoʻying.";
 let o;try{o=JSON.parse(new TextDecoder().decode(unb(parts[0])))}catch(e){return"Kalit notoʻgʻri yozilgan"}

 const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,unb(parts[1]),new TextEncoder().encode(parts[0]));

 if(D.used.includes(o.n))return"Bu kalit allaqachon ishlatilgan";

function card(t){const b=!!t.start;

function chart(){const t0=sod(),H=Math.max(new Date().getHours(),10),td=D.games.filter(g=>g.e>=t0),pts=[];
for(let h=10;h<=23;h++)pts.push(h<=H?td.filter(g=>new Date(g.e).getHours()<=h).reduce((s,g)=>s+g.a,0):null);
const mx=Math.max(...pts.filter(v=>v!=null),10000),X=i=>34+i*276/13,Y=v=>108-v/mx*88;
const lv=pts.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
const ln=lv.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
const g=[0,.5,1].map(k=>`<line x1="34" x2="310" y1="${108-k*88}" y2="${108-k*88}" stroke="#1F3129"/><text x="30" y="${111-k*88}" text-anchor="end">${Math.round(mx*k/1000)}k</text>`).join("");
const lb=[10,12,14,16,18,20,22].map(h=>`<text x="${X(h-10)}" y="124" text-anchor="middle">${h}:00</text>`).join("");
return`<svg class="ch" viewBox="0 0 320 130" role="img" aria-label="Bugungi tushum grafigi"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FC77A" stop-opacity=".35"/><stop offset="1" stop-color="#1FC77A" stop-opacity="0"/></linearGradient></defs>${g}${lb}<path d="${ln}L${lv[lv.length-1][0].toFixed(1)} 108L34 108Z" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="#1FC77A" stroke-width="2"/></svg>`}

`<div class="tg">${D.tables.map(card).join("")}</div><div class="r3">
<div class="pn"><h3>Bugungi tushum</h3><div class="big" data-od="${sm(sum(t0))}"></div>${D.tables.map(t=>`<div class="row"><span class="mu">${esc(t.name)}</span><b>${sm(D.games.filter(g=>g.e>=t0&&g.t===t.name).reduce((s,g)=>s+g.a,0))}</b></div>`).join("")}${chart()}</div>
<div class="pn"><h3>Soʻnggi oʻyinlar</h3>${gTable(D.games.slice(0,5))}</div>
<div class="pn"><h3>Tarif va sozlamalar</h3><div class="row"><span class="mu">Soatlik tarif</span><b>${sm(D.rate)}</b></div><div class="row"><span class="mu">Minimal toʻlov</span><b>${sm(D.min)}</b></div><div class="row"><span class="mu">Yaxlitlash</span><b>${sm(D.round)}</b></div>
<h3 style="margin-top:16px">${esc(D.hall)}</h3><p class="mu">${esc(D.addr)||"Manzil kiritilmagan"}</p><button class="b ghost" data-r="set">Sozlamalarni ochish</button></div></div>`},
tables(){return`<h2>Stollar</h2>`+stats()+`<div class="tg">${D.tables.map(card).join("")}</div>`},
rev(){const t0=sod(),days=[];for(let i=6;i>=0;i--){const a=t0-i*DAY;days.push([dm(a),sum(a,a+DAY)])}
const mx=Math.max(...days.map(d=>d[1]),1),w=t0-6*DAY;
return`<h2>Tushum</h2><div class="st">`+[["Bugun",sum(t0)],["Oxirgi 7 kun",sum(w)],["Shu oy",sum(mS())],["Jami",sum(0)]].map(x=>`<div class="sc"><div><small>${x[0]}</small><b data-od="${sm(x[1])}"></b></div></div>`).join("")+`</div>
<div class="r3"><div class="pn"><h3>Oxirgi 7 kun</h3><div class="bars">${days.map(d=>`<div class="bc"><span>${d[1]?f(d[1]/1000)+"k":""}</span><i style="height:${(d[1]/mx*8.7).toFixed(2)}rem"></i><span>${d[0]}</span></div>`).join("")}</div></div>
<div class="pn"><h3>Toʻlov usullari (7 kun)</h3>${METH.map(m=>`<div class="row"><span class="mu">${m}</span><b>${sm(D.games.filter(g=>g.e>=w&&g.m===m).reduce((s,g)=>s+g.a,0))}</b></div>`).join("")}</div></div>`},
hist(){const lim={today:sod(),week:sod()-6*DAY,all:0}[HF],g=D.games.filter(x=>x.e>=lim);
return`<h2>Oʻyinlar tarixi</h2><div class="bar"><select id="hf" style="width:auto">${[["today","Bugun"],["week","Oxirgi 7 kun"],["all","Barchasi"]].map(o=>`<option value="${o[0]}"${HF===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select><b>Jami: ${sm(g.reduce((s,x)=>s+x.a,0))}</b><button class="b grn" data-tg="1">Telegramga hisobot</button></div><div class="pn">${gTable(g)}</div>`},
exp(){const m=mS(),e=D.exp.filter(x=>x.at>=m).reduce((s,x)=>s+x.a,0),r=sum(m),n=r-e;
return`<h2>Xarajatlar</h2><div class="st"><div class="sc"><div><small>Shu oy tushum</small><b>${sm(r)}</b></div></div><div class="sc"><div><small>Shu oy xarajat</small><b>${sm(e)}</b></div></div><div class="sc"><div><small>Sof foyda</small><b style="color:${n<0?"#E5484D":"#1FC77A"}">${sm(n)}</b></div></div></div>
<form class="pn fm" id="ef"><input id="en" placeholder="Xarajat nomi (masalan, elektr)" required><input id="ea" type="number" min="1" placeholder="Summa, soʻm" required><button class="b grn">Qoʻshish</button></form>
<div class="pn">`+(D.exp.length?D.exp.map(x=>`<div class="row"><span>${dm(x.at)} · ${esc(x.n)}</span><span><b>${sm(x.a)}</b> <button class="b ghost" data-xd="${x.id}" aria-label="Oʻchirish">✕</button></span></div>`).join(""):`<p class="mu">Xarajat yoʻq. Yuqoridan qoʻshing: elektr, ijara, taʼmirlash.</p>`)+`</div>`},
set(){return`<h2>Sozlamalar</h2><form class="pn fm col" id="sf"><label>Bilyardxona nomi<input id="sh" value="${esc(D.hall)}" required></label><label>Manzil<input id="sa" value="${esc(D.addr)}"></label><label>Soatlik tarif (soʻm)<input id="sr" type="number" min="1000" step="500" value="${D.rate}" required></label><label>Minimal toʻlov (soʻm)<input id="sn" type="number" min="0" step="500" value="${D.min}"></label><label>Yaxlitlash<select id="so">${[100,500,1000].map(v=>`<option${D.round===v?" selected":""}>${v}</option>`).join("")}</select></label><label>Chegirmali vaqt (happy hour)<select id="hho"><option value="0"${D.hh.on?"":" selected"}>Oʻchiq</option><option value="1"${D.hh.on?" selected":""}>Yoqilgan</option></select></label><label>Boshlanish<input id="hhf" type="time" value="${D.hh.from}"></label><label>Tugash<input id="hht" type="time" value="${D.hh.to}"></label><label>Chegirma (%)<input id="hhp" type="number" min="0" max="90" value="${D.hh.pct}"></label><button class="b grn">Saqlash</button></form>
<div class="pn"><h3>Stollar</h3>${D.tables.map(t=>`<div class="tr"><input data-rn="${t.id}" value="${esc(t.name)}" aria-label="Stol nomi"><input type="number" data-tr="${t.id}" value="${t.base||""}" placeholder="${D.rate}" min="1000" step="500" style="max-width:9rem" aria-label="Stol narxi"><button class="b ghost" data-del="${t.id}" ${t.start?"disabled":""}>Oʻchirish</button></div>`).join("")}<button class="b ghost" data-at="1">＋ Stol qoʻshish</button></div>
<div class="pn"><h3>Ulashish va reklama</h3><p class="mu">Bilyardxona egalariga yuboring. Havola va tavsif tayyor.</p><div class="fm" style="margin:10px 0"><a class="b grn" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(SITE)}&text=${encodeURIComponent(SHARE_TEXT)}">Telegramda ulashish</a><button class="b ghost" data-copy="1">Havolani nusxalash</button><button class="b ghost" data-native="1">Ulashish</button><button class="b grn" data-install="1">📲 Telefonga o‘rnatish</button></div><p class="mu">Obuna va savollar: <a href="https://t.me/robettal" target="_blank" rel="noopener">@robettal</a> · <a href="tel:+998940309430">+998 94 030 94 30</a></p></div>
<div class="pn"><h3>Maʼlumotlar</h3><p class="mu">Hamma maʼlumot shu qurilmaning brauzerida saqlanadi.</p><button class="b red" data-reset="1">Hammasini oʻchirish</button></div>`}};
V.sub=()=>{const dl=Math.ceil((D.until-Date.now())/DAY);
return`<h2>Obuna</h2><div class="pn"><h3>Holat</h3><p>${act()?`Faol. Tugash sanasi: <b>${new Date(D.until).toLocaleDateString("ru-RU")}</b> (${dl} kun qoldi)`:`<b style="color:#E5484D">Obuna tugagan.</b> Yangi oʻyin boshlash yopiq, hisobotlar ochiq.`}</p></div>
<div class="st">${PLANS.map(p=>`<button class="sc plan" data-buy="${p[0]}"><div><small>${p[0]} oylik</small><b>${sm(p[1])}</b><small class="gr">Tanlash →</small></div></button>`).join("")}</div>
${SEL?payBox(SEL):""}<div class="pn"><h3>Telefonga oʻrnatish</h3><p class="mu">iPhone: Safari da sayt ochiladi, pastdagi <b>Ulashish</b> (↑) tugmasini bosing, soʻng <b>Bosh ekranga qoʻshish</b> ni tanlang.<br>Android: Chrome menyusidan <b>Ilovani oʻrnatish</b> ni tanlang.</p><button class="b grn" data-install="1">📲 Oʻrnatish</button><p class="mu" style="margin-top:10px">Telefon kamerasida <b>QR kod</b> ni skanerlasangiz, sayt Safari da ochiladi: <a href="https://amirxonx7.github.io/bilyard-pro/" target="_blank" rel="noopener">amirxonx7.github.io/bilyard-pro</a></p></div><div class="pn"><h3>Obunani faollashtirish</h3><p class="mu">1. Pastdagi telefon yoki Telegram orqali toʻlang.<br>2. Toʻlovdan keyin kalit olasiz, uni quyidagi maydonga qoʻying.</p><p class="mu">${OWNER}</p><form class="fm" id="kf"><input id="kk" placeholder="Obuna kalitini qoʻying" required autocomplete="off"><button class="b grn">Faollashtirish</button></form></div>`};
function render(){$("#view").innerHTML=banner()+V[R]();$("#hn").textContent=D.hall;
$("#ss").textContent=act()?"Obuna: "+Math.ceil((D.until-Date.now())/DAY)+" kun":"Obuna tugagan";
document.querySelectorAll(".nav [data-r],.tabbar [data-r]").forEach(b=>b.classList.toggle("on",b.dataset.r===R));
document.querySelectorAll("#view [data-od]").forEach(e=>setOdo(e,e.dataset.od));tick()}
function tick(){const n=Date.now(),d=new Date(n);$("#clock").textContent=hm(n);$("#date").textContent=p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear();
D.tables.forEach(t=>{if(!t.start)return;const a=document.querySelector(`[data-t="${t.id}"]`),b=document.querySelector(`[data-a="${t.id}"]`);if(a)setOdo(a,hms(n-t.start));if(b)setOdo(b,sm(live(n-t.start,t.rate)))})}

/* oyna va xabar */
let MB=[];
function modal(title,html,btns){setTimeout(()=>document.querySelectorAll("#modal [data-od]").forEach(e=>setOdo(e,e.dataset.od)),0);MB=btns.map(b=>b[2]);$("#modal").innerHTML=`<div class="ov"><div class="md" role="dialog" aria-modal="true"><h3>${title}</h3>${html}<div class="mb">${btns.map((b,i)=>`<button class="b ${b[1]}" data-mb="${i}">${b[0]}</button>`).join("")}</div></div></div>`}
const closeM=()=>{$("#modal").innerHTML="";MB=[]};
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",Math.max(2200,m.length*70))}

function stop(id){const t=tb(id),e=Date.now(),a=amt(e-t.start,t.rate);
modal(esc(t.name)+" — toʻxtatildi",`<p class="mu">Oʻynalgan vaqt: ${dur(e-t.start)}</p><div class="big" data-od="${sm(a)}"></div><p class="mu">Toʻlov usulini tanlang:</p>`,
[...METH.map(m=>[m,"grn",()=>{const tt=tb(id);if(!tt||!tt.start){closeM();render();return}D.games.unshift({id:D.nid++,t:tt.name,s:tt.start,e,a,m});tt.start=null;tt.rate=null;save();closeM();render();toast(sm(a)+" qabul qilindi")}]),["Bekor qilish","ghost",closeM]])}
function more(id){const t=tb(id);
modal("Qoʻshimcha vaqt",`<p class="mu">Oʻyin vaqtiga necha daqiqa qoʻshiladi?</p><input id="mn" type="number" min="1" max="600" value="15">`,
[["Qoʻshish","grn",()=>{const m=Math.min(600,Math.max(1,+$("#mn").value||1));t.start-=m*6e4;save();closeM();render();toast(m+" daqiqa qoʻshildi")}],["Bekor qilish","ghost",closeM]])}

/* hodisalar */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.r){R=d.r;render();scrollTo(0,0)}
else if((d.go||d.at)&&!act()){toast("Obuna tugagan. Obuna boʻlimidan faollashtiring.");R="sub";render()}
else if(d.go){try{const t=tb(d.go);if(!t)throw new Error("stol topilmadi");if(!D.hh)D.hh={on:false,from:"02:00",to:"12:00",pct:20};t.start=Date.now();t.rate=effRate(t);save();render();toast(t.name+" boshlandi")}catch(err){toast("Xatolik: "+err.message)}}
else if(d.stop)stop(d.stop);
else if(d.more)more(d.more);
else if(d.mb!=null){const fn=MB[d.mb];fn&&fn()}
else if(d.xd){D.exp=D.exp.filter(x=>x.id!=d.xd);save();render()}
else if(d.del){D.tables=D.tables.filter(t=>t.id!=d.del);save();render()}
else if(d.at){const id=D.nid++;D.tables.push({id,name:D.tables.length+1+" - Stol",start:null});save();render();toast("Stol qoʻshildi")}
else if(d.tg){const t0=sod(),g=D.games.filter(x=>x.e>=t0),tot=sum(t0),ex=D.exp.filter(x=>x.at>=t0).reduce((s,x)=>s+x.a,0);
const by=D.tables.map(t=>`${t.name}: ${sm(g.filter(x=>x.t===t.name).reduce((s,x)=>s+x.a,0))}`).join("\n");
const mt=METH.map(m=>`${m}: ${sm(g.filter(x=>x.m===m).reduce((s,x)=>s+x.a,0))}`).join("\n");
const txt=`📊 ${D.hall} — kunlik hisobot (${dm(Date.now())})\n\nOʻyinlar: ${g.length} ta\nTushum: ${sm(tot)}\nXarajat: ${sm(ex)}\nSof: ${sm(tot-ex)}\n\nStollar:\n${by}\n\nToʻlov usullari:\n${mt}`;
window.open("https://t.me/share/url?url="+encodeURIComponent(SITE)+"&text="+encodeURIComponent(txt),"_blank","noopener")}
else if(d.buy)buy(d.buy)
else if(d.card)copy(CARD.replace(/ /g,""))
else if(d.codecopy)copy(d.codecopy)
else if(d.install)install()
else if(d.copy){navigator.clipboard?navigator.clipboard.writeText(SITE).then(()=>toast("Havola nusxalandi"),()=>toast(SITE)):toast(SITE)}
else if(d.native){navigator.share?navigator.share({title:"Bilyard Pro",text:SHARE_TEXT,url:SITE}).catch(()=>{}):toast(SITE)}
else if(d.reset)modal("Hammasini oʻchirasizmi?",`<p class="mu">Barcha oʻyinlar, xarajatlar va sozlamalar oʻchadi. Buni qaytarib boʻlmaydi.</p>`,[["Ha, oʻchirish","red",()=>{D=fresh();save();closeM();R="home";render()}],["Bekor qilish","ghost",closeM]])});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;
if(id==="kf"){activate($("#kk").value).then(m=>{if(m)toast(m);else{render();toast("Obuna faollashtirildi")}});return}
if(id==="ef"){D.exp.unshift({id:D.nid++,at:Date.now(),n:$("#en").value.trim(),a:Math.round(+$("#ea").value)});save();render();toast("Xarajat qoʻshildi")}
if(id==="sf"){D.hall=$("#sh").value.trim()||D.hall;D.addr=$("#sa").value.trim();D.rate=Math.max(1000,+$("#sr").value||D.rate);D.min=Math.max(0,+$("#sn").value||0);D.round=+$("#so").value;D.hh={on:$("#hho").value==="1",from:$("#hhf").value||"02:00",to:$("#hht").value||"12:00",pct:Math.min(90,Math.max(0,+$("#hhp").value||0))};save();render();toast("Saqlandi")}});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.tr){const x=tb(t.dataset.tr);x.base=+t.value||null;save();toast("Stol narxi saqlandi")}
if(t.id==="hf"){HF=t.value;render()}
if(t.dataset.rn){const x=tb(t.dataset.rn);if(t.value.trim()){x.name=t.value.trim();save();toast("Saqlandi")}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});

/* ---- Obuna toʻlovi: karta va chek ---- */
function copy(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast("Nusxalandi"),()=>toast(t)):toast(t)}
const CARD="5614 6818 5255 5915",CARD_NAME="Abdumannonov Amirxon";
let SEL=null;
function payBox(m){const price=PLANS.find(p=>p[0]==m)[1];const code=(D.ord&&D.ord[m])||"";

<p class="mu">1. Quyidagi kartaga <b style="color:var(--ink)">${sm(price)}</b> oʻtkazing:</p>
<div class="big" style="font-size:1.5rem;letter-spacing:.06em;color:var(--ink)">${CARD}</div><p><b>${CARD_NAME}</b></p>

<div class="fm" style="margin-top:12px"><button class="b ghost" data-card="1">Kartani nusxalash</button><button class="b ghost" data-codecopy="${code}">Kodni nusxalash</button><a class="b grn" href="https://t.me/robettal" target="_blank" rel="noopener">Telegramda yozish</a></div></div>`}
function buy(m){SEL=m;D.ord=D.ord||{};if(!D.ord[m]){D.ord[m]="BP-"+genId().slice(0,5);save()}
 render();setTimeout(()=>{const e=document.getElementById("pay");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},80)}

/* ---- Telefon ilovasi (PWA) ---- */
let deferredPWA=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPWA=e});
async function install(){
 if(deferredPWA){deferredPWA.prompt();try{await deferredPWA.userChoice}catch(e){};deferredPWA=null;return}
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
 const inApp=ios&&!/Safari/.test(navigator.userAgent)||/CriOS|FxiOS|Telegram|Claude/i.test(navigator.userAgent);
 const site="https://amirxonx7.github.io/bilyard-pro/";
 modal("Telefonga oʻrnatish",`<p class="mu">${ios?"iPhone da oʻrnatish uchun ilova <b>Safari</b> da ochilishi kerak. Bu sahifa ichidan oʻrnatib boʻlmaydi.":"Brauzer menyusidan <b>Ilovani oʻrnatish</b> yoki <b>Bosh ekranga qoʻshish</b> ni tanlang."}</p>${ios?`<ol class="mu" style="padding-left:1.2rem"><li>Quyidagi havolani nusxalang va Safari ga qoʻying</li><li>Safari da Ulashish (↑) → <b>Bosh ekranga qoʻshish</b></li></ol><p><b style="color:var(--gr)">${site}</b></p>`:""}`,
 [...(ios?[["Havolani nusxalash","grn",()=>copy(site)]]:[]),["Yopish","ghost",closeM]])}

render();setInterval(tick,1000);cloudInit();
</script>
